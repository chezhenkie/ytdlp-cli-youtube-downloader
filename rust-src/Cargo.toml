# Native workspace (specsheet section 4). Two members: the product
# binary (cli/) and the scripted yt-dlp stand-in (fake-ytdlp/), the
# latter a development tool that is never shipped in a bundle.

[workspace]
resolver = "3"
members = ["cli", "fake-ytdlp"]

[workspace.package]
version = "2.9.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/chezhenkie/ytdlp-cli-youtube-downloader"

# Python ints are arbitrary precision, Rust ints are not; a ported line
# that relied on that silently wraps in release builds unless overflow
# checks stay on. The rest of the profile is the measured set: thin LTO
# with one codegen unit shaves the shipped binary by about a quarter
# with the EOF-run latency unchanged, and strip drops the symbols a
# shipped binary never reads back.
[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
strip = "symbols"
