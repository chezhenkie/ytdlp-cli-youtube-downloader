[package]
name = "ytdlp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "yt-dlp cli - text-menu download wrapper around yt-dlp (native port)."

[lib]
name = "ytdlp_cli"
path = "src/lib.rs"

[[bin]]
name = "ytdlp"
path = "src/main.rs"

# The capability table in the specsheet (section 4): std has no
# registry, no access(2) and no console APIs, so these two FFI crates
# are the drawn entries from the minimal vetted crate set. Phase 6 adds
# the console features: VT enable, screen buffer info, the folder
# dialog and CoTaskMemFree.
# Phase 8 (specsheet section 4, phase-8 port notes): the network and
# archive layers. ureq's defaults are rustls + ring + webpki-roots, so
# certificate verification never reads the host trust store; the windows
# build adds the HKCU Internet Settings fallback so proxy resolution
# matches python's getproxies() (IF-7). zip and tar come with default
# features off so only decode paths are compiled, and both decompress
# through pure-rust crates (miniz_oxide, lzma-rust2) - no C toolchain.
# The archive fixture builders run in tests AND in the packaged
# selftest, which needs the xz encoder as a main dependency (specsheet
# section 4, phase-9 note; the decode-only G8 build is recorded as
# amended).
[dependencies]
ureq = "3.4.2"
flate2 = "1"
zip = { version = "9.0.0", default-features = false, features = [
    "deflate-flate2",
] }
tar = { version = "0.4.46", default-features = false }
lzma-rust2 = { version = "0.15.8", default-features = false, features = [
    "std",
    "xz",
    "encoder",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
ureq = { version = "3.4.2", features = ["win-system-proxy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# FR-16: the PE version resource lives in cli/build.rs. Build-time only,
# windows builds only, so the crate is never compiled for other hosts.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
