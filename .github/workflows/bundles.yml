name: bundles

# Phase 10 (owner call 2026-10-16): assemble the release files on the
# native runners. workflow_dispatch only. This workflow builds artifacts; it does
# not tag or publish anything. The release commit carries the digests, the tag
# follows, and gh release upload places exactly these bytes. The 2026-10-17k
# owner call adds installers and moves macos from the tar bundle to a pkg (the
# tar is gone - it was the confusing twin): the release is four bundles
# (windows/linux lean+portable each), the windows setup.exe, the macos-arm64
# pkg and RELEASE-NOTES.md - seven release files. No bare cli image is
# published on any platform (owner calls 2026-10-17h and j).
#
# Owner call 2026-10-17n adds the linux musl bundle (FR-19): a fifth release
# file, the cli built for x86_64-unknown-linux-musl, cli-only (no yt-dlp, no
# ffmpeg - the system package manager provides them; apk add yt-dlp pulls
# ffmpeg and the JS runtime along on Alpine). Its job builds, assembles and
# proves it here: static link, extract, packaged selftest 190/0, and no
# bin/yt-dlp inside the tar. The release is eight files.
#
# Owner call 2026-10-18 (FR-20) adds the standalone srtstripper binary to every
# bundle's bin/: the windows exe for the windows bundles and the setup.exe, the
# linux glibc build for the linux bundles, the musl build for the musl bundle
# (first-party, same MIT author - the NFR-1 deviation stays about yt-dlp and
# ffmpeg), the arm64 build for the macos pkg. Pinned to the v1.6.4 assets and
# digest-checked like every other payload.
#
# The installers are built here and proven here, not just assembled: the
# windows job silently installs the setup.exe, runs the installed binary's
# selftest (190 checks, 0 failed), checks the PATH entry and uninstalls again;
# the macos job installs the pkg with `installer -pkg` on the runner, runs the
# installed binary, checks writability, the launcher and the shipped uninstall
# script. Both installers carry the same portable payload the zip/tar bundles
# carry.
#
# Payload pins:
#   yt-dlp 2026.08.19 onedir zips: yt-dlp_win.zip (windows),
#           yt-dlp_linux.zip (linux), yt-dlp_macos.zip (macos arm64). The zip
#           carries the binary plus _internal and both are staged into bin/,
#           so yt-dlp runs from the tree. The onefile build instead unpacks
#           139 files / 23,815,375 bytes into %TEMP%\_MEIxxxxx on every
#           launch (measured 5,698 writes per launch; the app launches it
#           2x with subs off, 3x with subs on).
#   ffmpeg: gyan.dev 9.0.2 essentials (windows), BtbN n9.0.2-27-g7e93014c5b
#           autobuild-2026-10-13 (linux; the dated tag, so the pin cannot move
#           under CI the way the moving "latest" tag did),
#           shaka-project/static-ffmpeg-binaries n8.1.2-1 ffmpeg-osx-arm64
#           (macos; owner call 2026-10-17g: a public repo with contributors,
#           CI-built from source, per-asset sha256 - no one-person sites)
# Every payload is checked against its pinned digest before anything is staged.
# The GPL license texts are not fetched: they ship from rust-src/packaging/ (the
# same bytes the v1.5.0 bundles carried) because the first dispatch showed
# www.gnu.org unreachable from the windows runners. Their digests are asserted
# here all the same.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  YTDLP_URL_BASE: https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19
  YTDLP_WIN_ZIP_SHA256: 30b4c14aafab6082becff7881e41b76df46dc43ea7633479410a91e29da492bf
  YTDLP_LINUX_ZIP_SHA256: 32e72032766bef9199d99d15beb69fd52e46df8f8b06f0d8745db59e04d339e9
  YTDLP_MACOS_ZIP_SHA256: 07e54b0865303c864006925913bce2604f8ee8cc6f18699bac9c309f9328a6d8
  FFMPEG_WINDOWS_URL: https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip
  FFMPEG_WINDOWS_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
  FFMPEG_LINUX_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-13-13-05/ffmpeg-n9.0.2-27-g7e93014c5b-linux64-gpl-9.0.tar.xz
  FFMPEG_LINUX_SHA256: 50e0ede136e3545758a8dfb2e6cd12ec865643cd138af9ce6cd36a9015f395c2
  FFMPEG_MACOS_URL: https://github.com/shaka-project/static-ffmpeg-binaries/releases/download/n8.1.2-1/ffmpeg-osx-arm64
  FFMPEG_MACOS_SHA256: e7b9fcd97f95f333512d6e8b8ac24d9dbc08f189f36047695499bd7b57214b22
  SRTSTRIPPER_URL_BASE: https://github.com/chezhenkie/srt-subtitle-stripper/releases/download/v1.6.4
  SRTSTRIPPER_WINDOWS_SHA256: 8cd030d4db776e3db1ca16bb286c1eeaecc71dd99c4ddb162331b0d68cb14cbb
  SRTSTRIPPER_LINUX_SHA256: 85196f96349cdc0ea6c2bb54b8aee9bc5fc2d28d8ad2a51df00453c8cdac2fd1
  SRTSTRIPPER_MUSL_SHA256: 0a1a7ae08b4b54fc97da2313fe78b0c02185c4110994e9e45e3d3f60498fef9b
  SRTSTRIPPER_MACOS_SHA256: 4d70f0049be33ca63faf0cad6bc0c2a73ea29ff8bc1fd8f52c3cffea6566913c
  GPL2_SHA256: edaef632cbb643e4e7a221717a6c441a4c1a7c918e6e4d56debc3d8739b233f6
  GPL3_SHA256: 3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986

jobs:
  windows-bundles:
    name: windows lean + portable + setup
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: build the release binary (crt-static from repo .cargo/config.toml)
        working-directory: rust-src
        run: cargo build --release -p ytdlp-cli
      - name: verify payload pins and assemble
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Get-Pinned([string]$url, [string]$out, [string]$want) {
            curl.exe -fsSL --retry 3 -o $out $url
            if ($LASTEXITCODE -ne 0) { throw "download failed: $url" }
            $got = (Get-FileHash -Algorithm SHA256 $out).Hash.ToLower()
            if ($got -ne $want) { throw "digest mismatch: $url`n  want $want`n  got  $got" }
            Write-Host "pin ok: $out $got"
          }
          $m = [regex]::Match((Get-Content rust-src/Cargo.toml -Raw), '(?m)^version = "([^"]+)"')
          if (-not $m.Success) { throw "version not found in rust-src/Cargo.toml" }
          $ver = $m.Groups[1].Value
          Write-Host "assembling v$ver"
          New-Item -ItemType Directory -Force payload, dist | Out-Null
          Get-Pinned "$env:YTDLP_URL_BASE/yt-dlp_win.zip" payload/yt-dlp-win.zip $env:YTDLP_WIN_ZIP_SHA256
          Get-Pinned $env:FFMPEG_WINDOWS_URL payload/ffmpeg-windows.zip $env:FFMPEG_WINDOWS_SHA256
          Get-Pinned "$env:SRTSTRIPPER_URL_BASE/srtstripper-windows-x86_64.exe" payload/srtstripper.exe $env:SRTSTRIPPER_WINDOWS_SHA256
          Expand-Archive -Path payload/yt-dlp-win.zip -DestinationPath payload/yt-dlp-win
          foreach ($f in @("yt-dlp.exe", "_internal")) {
            if (-not (Test-Path "payload/yt-dlp-win/$f")) { throw "yt-dlp onedir part missing: $f" }
          }
          $g2 = (Get-FileHash -Algorithm SHA256 rust-src/packaging/GPL-2.0.txt).Hash.ToLower()
          if ($g2 -ne $env:GPL2_SHA256) { throw "GPL-2.0.txt digest mismatch: $g2" }
          $g3 = (Get-FileHash -Algorithm SHA256 rust-src/packaging/GPL-3.0.txt).Hash.ToLower()
          if ($g3 -ne $env:GPL3_SHA256) { throw "GPL-3.0.txt digest mismatch: $g3" }
          $stage = "dist/ytdlp-cli-v$ver"
          New-Item -ItemType Directory -Force "$stage/bin" | Out-Null
          Copy-Item rust-src/target/release/ytdlp.exe "$stage/ytdlp.exe"
          Copy-Item rust-src/packaging/run-ytdlp.bat, rust-src/packaging/run-ytdlp.sh "$stage/"
          Copy-Item README.md, CHANGELOG.md, LICENSE, THIRD-PARTY-NOTICES.md "$stage/"
          Copy-Item payload/yt-dlp-win/yt-dlp.exe "$stage/bin/yt-dlp.exe"
          Copy-Item payload/yt-dlp-win/_internal "$stage/bin/_internal" -Recurse
          Copy-Item payload/srtstripper.exe "$stage/bin/srtstripper.exe"
          $probe = & "$stage/bin/yt-dlp.exe" --version
          if ($LASTEXITCODE -ne 0 -or "$probe" -notmatch '^\d{4}\.\d{2}\.\d{2}') { throw "staged yt-dlp tree probe failed: $probe" }
          Write-Host "staged yt-dlp tree runs: $probe"
          Compress-Archive -Path $stage -DestinationPath "dist/ytdlp-cli-v$ver-windows-lean.zip"
          Expand-Archive -Path payload/ffmpeg-windows.zip -DestinationPath payload/ffmpeg-windows
          $ff = Get-ChildItem payload/ffmpeg-windows -Recurse -Filter ffmpeg.exe | Where-Object { $_.Directory.Name -eq "bin" } | Select-Object -First 1
          if (-not $ff) { throw "ffmpeg.exe not found in the gyan archive" }
          Copy-Item $ff.FullName "$stage/bin/ffmpeg.exe"
          Copy-Item rust-src/packaging/GPL-2.0.txt, rust-src/packaging/GPL-3.0.txt "$stage/"
          Compress-Archive -Path $stage -DestinationPath "dist/ytdlp-cli-v$ver-windows-portable.zip"
      - name: install Inno Setup (the setup.exe it builds needs nothing at run time)
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: build the windows installer (per-user, no admin prompt, portable payload)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $m = [regex]::Match((Get-Content rust-src/Cargo.toml -Raw), '(?m)^version = "([^"]+)"')
          if (-not $m.Success) { throw "version not found in rust-src/Cargo.toml" }
          $ver = $m.Groups[1].Value
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $stage = "$PWD/dist/ytdlp-cli-v$ver"
          & $iscc "/DAppVer=$ver" "/DStage=$stage" "/O$PWD/dist" "rust-src/packaging/windows-installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          if (-not (Test-Path "dist/ytdlp-cli-v$ver-windows-setup.exe")) { throw "setup.exe not produced" }
      - name: installer proof - silent install, selftest 190/0, PATH add/remove, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $m = [regex]::Match((Get-Content rust-src/Cargo.toml -Raw), '(?m)^version = "([^"]+)"')
          $ver = $m.Groups[1].Value
          $setup = "dist/ytdlp-cli-v$ver-windows-setup.exe"
          $tdir = "$PWD\inst-test\ytdlp-cli"
          # canonical separator form for the registry-value comparisons below;
          # the registry may carry either form (found in run 39055610868)
          $tdirN = $tdir.Replace('/', '\')
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$tdir" -Wait
          if (-not (Test-Path "$tdir/ytdlp.exe")) { throw "installed ytdlp.exe missing" }
          $report = & "$tdir/ytdlp.exe" --selftest | Out-String
          $rc = $LASTEXITCODE
          if ($rc -ne 0) { throw "installed selftest rc $rc" }
          if ($report -notmatch "selftest: 190 checks, 0 failed") { throw "selftest report mismatch: $report" }
          $pe = (Get-Item "$tdir/ytdlp.exe").VersionInfo
          if ($pe.FileDescription -ne "ytdlp") { throw "FileDescription: $($pe.FileDescription)" }
          if ($pe.ProductName -ne "yt-dlp cli") { throw "ProductName: $($pe.ProductName)" }
          if ($pe.FileVersion -notlike "$ver*") { throw "FileVersion: $($pe.FileVersion)" }
          foreach ($f in @("bin/yt-dlp.exe", "bin/_internal", "bin/ffmpeg.exe", "bin/srtstripper.exe", "run-ytdlp.bat", "README.md", "GPL-2.0.txt", "GPL-3.0.txt")) {
            if (-not (Test-Path "$tdir/$f")) { throw "installed file missing: $f" }
          }
          if ((Get-ChildItem "$tdir/bin/_internal" -Recurse -File).Count -lt 100) { throw "installed _internal tree is incomplete" }
          $payloadVersion = & "$tdir/bin/yt-dlp.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "installed yt-dlp tree failed to run" }
          Write-Host "installed yt-dlp tree runs: $payloadVersion"
          $pathNow = (Get-ItemProperty -Path "HKCU:\Environment" -Name Path).Path
          if ($pathNow.Replace('/', '\') -notlike "*$tdirN*") { Write-Host "HKCU Path after install: $pathNow"; throw "PATH entry missing after install" }
          Start-Process -FilePath "$tdir/unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $deadline = (Get-Date).AddSeconds(20)
          while ((Test-Path $tdir) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $tdir) { throw "uninstall left files behind" }
          $pathAfter = (Get-ItemProperty -Path "HKCU:\Environment" -Name Path).Path
          if ($pathAfter.Replace('/', '\') -like "*$tdirN*") { Write-Host "HKCU Path after uninstall: $pathAfter"; throw "PATH entry survived uninstall" }
          Remove-Item -Recurse -Force "$PWD/inst-test" -ErrorAction SilentlyContinue
          Write-Host "installer proof passed: install, selftest 190/0, PE fields, PATH add/remove, clean uninstall"
      - name: checksums and sizes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cd dist
          Get-ChildItem *.zip, *.exe | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS
          Get-ChildItem *.zip, *.exe | Sort-Object Name | ForEach-Object { "size: $($_.Name) $($_.Length)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            dist/ytdlp-cli-*.zip
            dist/ytdlp-cli-*.exe
            dist/SHA256SUMS
          if-no-files-found: error

  linux-bundles:
    name: linux lean + portable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: build the release binary
        working-directory: rust-src
        run: cargo build --release -p ytdlp-cli
      - name: verify payload pins and assemble
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' rust-src/Cargo.toml | head -n1)
          echo "assembling v$ver"
          mkdir -p payload dist
          get_pinned() { # url out want
            curl -fsSL --retry 3 -o "$2" "$1"
            echo "$3  $2" | sha256sum -c -
          }
          get_pinned "$YTDLP_URL_BASE/yt-dlp_linux.zip" payload/yt-dlp_linux.zip "$YTDLP_LINUX_ZIP_SHA256"
          get_pinned "$FFMPEG_LINUX_URL" payload/btbn.tar.xz "$FFMPEG_LINUX_SHA256"
          get_pinned "$SRTSTRIPPER_URL_BASE/srtstripper-linux-x86_64" payload/srtstripper "$SRTSTRIPPER_LINUX_SHA256"
          echo "$GPL2_SHA256  rust-src/packaging/GPL-2.0.txt" | sha256sum -c -
          echo "$GPL3_SHA256  rust-src/packaging/GPL-3.0.txt" | sha256sum -c -
          mkdir -p payload/yt-dlp-linux
          unzip -q payload/yt-dlp_linux.zip -d payload/yt-dlp-linux
          test -f payload/yt-dlp-linux/yt-dlp
          test -d payload/yt-dlp-linux/_internal
          tar -xJf payload/btbn.tar.xz -C payload
          ff=$(find payload -path '*/bin/ffmpeg' -type f -print -quit)
          test -n "$ff"
          stage="dist/ytdlp-cli-v$ver"
          mkdir -p "$stage/bin"
          install -m 0755 rust-src/target/release/ytdlp "$stage/ytdlp"
          install -m 0755 rust-src/packaging/run-ytdlp.sh "$stage/run-ytdlp.sh"
          install -m 0644 rust-src/packaging/run-ytdlp.bat "$stage/run-ytdlp.bat"
          install -m 0644 README.md CHANGELOG.md LICENSE THIRD-PARTY-NOTICES.md "$stage/"
          install -m 0755 payload/yt-dlp-linux/yt-dlp "$stage/bin/yt-dlp"
          cp -a payload/yt-dlp-linux/_internal "$stage/bin/_internal"
          install -m 0755 payload/srtstripper "$stage/bin/srtstripper"
          "$stage/bin/yt-dlp" --version
          tar -czf "dist/ytdlp-cli-v$ver-linux-lean.tar.gz" -C dist "ytdlp-cli-v$ver"
          install -m 0755 "$ff" "$stage/bin/ffmpeg"
          install -m 0644 rust-src/packaging/GPL-2.0.txt rust-src/packaging/GPL-3.0.txt "$stage/"
          tar -czf "dist/ytdlp-cli-v$ver-linux-portable.tar.gz" -C dist "ytdlp-cli-v$ver"
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          ls -l ytdlp-cli-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            dist/ytdlp-cli-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  linux-musl-bundle:
    name: linux musl (alpine) bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: x86_64-unknown-linux-musl
      - name: musl C toolchain (ring compiles C for the target)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: build the musl release binary
        working-directory: rust-src
        run: cargo build --release -p ytdlp-cli --target x86_64-unknown-linux-musl
      - name: assemble the bundle (no yt-dlp, no ffmpeg - apk provides the runtime; the first-party srtstripper rides along)
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' rust-src/Cargo.toml | head -n1)
          echo "assembling v$ver (linux musl)"
          mkdir -p payload dist
          get_pinned() { # url out want
            curl -fsSL --retry 3 -o "$2" "$1"
            echo "$3  $2" | sha256sum -c -
          }
          get_pinned "$SRTSTRIPPER_URL_BASE/srtstripper-linux-x86_64-musl" payload/srtstripper-musl "$SRTSTRIPPER_MUSL_SHA256"
          stage="dist/ytdlp-cli-v$ver"
          mkdir -p "$stage/bin"
          install -m 0755 rust-src/target/x86_64-unknown-linux-musl/release/ytdlp "$stage/ytdlp"
          install -m 0755 rust-src/packaging/run-ytdlp.sh "$stage/run-ytdlp.sh"
          install -m 0644 rust-src/packaging/run-ytdlp.bat "$stage/run-ytdlp.bat"
          install -m 0644 README.md CHANGELOG.md LICENSE THIRD-PARTY-NOTICES.md "$stage/"
          install -m 0755 payload/srtstripper-musl "$stage/bin/srtstripper"
          tar -czf "dist/ytdlp-cli-v$ver-linux-musl.tar.gz" -C dist "ytdlp-cli-v$ver"
          cd dist
          sha256sum ytdlp-cli-v$ver-linux-musl.tar.gz > SHA256SUMS
          cat SHA256SUMS
          ls -l ytdlp-cli-v$ver-linux-musl.tar.gz
      - name: run proof - static link, packaged selftest, cli-only payload
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' rust-src/Cargo.toml | head -n1)
          mkdir -p dist/run
          tar -xzf "dist/ytdlp-cli-v$ver-linux-musl.tar.gz" -C dist/run
          bin="dist/run/ytdlp-cli-v$ver/ytdlp"
          file "$bin"
          if ! file "$bin" | grep -Eq 'statically linked|static-pie'; then
            echo "not a static build - refusing"; exit 1
          fi
          if tar -tzf "dist/ytdlp-cli-v$ver-linux-musl.tar.gz" | grep -q 'bin/yt-dlp'; then
            echo "the musl bundle must not carry yt-dlp"; exit 1
          fi
          echo "$SRTSTRIPPER_MUSL_SHA256  dist/run/ytdlp-cli-v$ver/bin/srtstripper" | sha256sum -c -
          report=$("$bin" --selftest)
          echo "$report" | grep -q "selftest: 190 checks, 0 failed"
          echo "$report" | tail -n 3
          echo "musl run proof passed: static, selftest 190/0, no bundled yt-dlp, srtstripper pinned"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-musl-bundle
          path: |
            dist/ytdlp-cli-v*-linux-musl.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  macos-pkg:
    name: macos pkg
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: build the release binary
        working-directory: rust-src
        run: cargo build --release -p ytdlp-cli
      - name: verify payload pins, assemble the tree and build the pkg
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' rust-src/Cargo.toml | head -n1)
          echo "assembling v$ver"
          mkdir -p payload dist
          get_pinned() { # url out want
            curl -fsSL --retry 3 -o "$2" "$1"
            echo "$3  $2" | shasum -a 256 -c -
          }
          get_pinned "$YTDLP_URL_BASE/yt-dlp_macos.zip" payload/yt-dlp_macos.zip "$YTDLP_MACOS_ZIP_SHA256"
          get_pinned "$FFMPEG_MACOS_URL" payload/ffmpeg-osx-arm64 "$FFMPEG_MACOS_SHA256"
          get_pinned "$SRTSTRIPPER_URL_BASE/srtstripper-macos-arm64" payload/srtstripper-macos "$SRTSTRIPPER_MACOS_SHA256"
          echo "$GPL2_SHA256  rust-src/packaging/GPL-2.0.txt" | shasum -a 256 -c -
          echo "$GPL3_SHA256  rust-src/packaging/GPL-3.0.txt" | shasum -a 256 -c -
          mkdir -p payload/yt-dlp-macos
          unzip -q payload/yt-dlp_macos.zip -d payload/yt-dlp-macos
          test -f payload/yt-dlp-macos/yt-dlp_macos
          test -d payload/yt-dlp-macos/_internal
          # the payload tree, shaped for the pkg's --install-location /:
          # /usr/local/ytdlp-cli is the app (portable layout), /usr/local/bin/ytdlp
          # is the symlink that puts it on PATH
          root=dist/pkg-root
          app="$root/usr/local/ytdlp-cli"
          mkdir -p "$app/bin" "$root/usr/local/bin"
          install -m 0755 rust-src/target/release/ytdlp "$app/ytdlp"
          install -m 0755 rust-src/packaging/run-ytdlp.sh "$app/run-ytdlp.sh"
          install -m 0644 rust-src/packaging/run-ytdlp.bat "$app/run-ytdlp.bat"
          install -m 0755 rust-src/packaging/uninstall-macos.sh "$app/uninstall-macos.sh"
          install -m 0644 README.md CHANGELOG.md LICENSE THIRD-PARTY-NOTICES.md "$app/"
          install -m 0755 payload/yt-dlp-macos/yt-dlp_macos "$app/bin/yt-dlp"
          cp -a payload/yt-dlp-macos/_internal "$app/bin/_internal"
          "$app/bin/yt-dlp" --version
          shasum -a 256 "$app/bin/yt-dlp" | awk '{print $1}' > dist/ytdlp-binary.sha256
          install -m 0755 payload/ffmpeg-osx-arm64 "$app/bin/ffmpeg"
          install -m 0755 payload/srtstripper-macos "$app/bin/srtstripper"
          install -m 0644 rust-src/packaging/GPL-2.0.txt rust-src/packaging/GPL-3.0.txt "$app/"
          ln -s ../ytdlp-cli/ytdlp "$root/usr/local/bin/ytdlp"
          file "$app/ytdlp" "$app/bin/yt-dlp" "$app/bin/ffmpeg" "$app/bin/srtstripper"
          mkdir -p dist/pkg-scripts
          install -m 0755 rust-src/packaging/macos-pkg-postinstall.sh dist/pkg-scripts/postinstall
          pkgbuild --root "$root" --install-location / --scripts dist/pkg-scripts \
            --identifier com.github.chezhenkie.ytdlp-cli --version "$ver" \
            "dist/ytdlp-cli-v$ver-macos-arm64.pkg"
          pkgutil --payload-files "dist/ytdlp-cli-v$ver-macos-arm64.pkg" | head -40
      - name: installer proof - install the pkg, run it, uninstall via the shipped script
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' rust-src/Cargo.toml | head -n1)
          pkg="dist/ytdlp-cli-v$ver-macos-arm64.pkg"
          sudo installer -pkg "$pkg" -target /
          test -L /usr/local/bin/ytdlp
          report=$(/usr/local/bin/ytdlp --selftest)
          echo "$report" | tail -3
          echo "$report" | grep -q "selftest: 190 checks, 0 failed"
          # the tree must be writable by the user running it (settings.json,
          # yt-dlp -U and the ffmpeg offer all write into the tree)
          touch /usr/local/ytdlp-cli/.wtest && rm /usr/local/ytdlp-cli/.wtest
          echo "$(cat dist/ytdlp-binary.sha256)  /usr/local/ytdlp-cli/bin/yt-dlp" | shasum -a 256 -c -
          test -d /usr/local/ytdlp-cli/bin/_internal
          /usr/local/ytdlp-cli/bin/yt-dlp --version
          echo "$FFMPEG_MACOS_SHA256  /usr/local/ytdlp-cli/bin/ffmpeg" | shasum -a 256 -c -
          echo "$SRTSTRIPPER_MACOS_SHA256  /usr/local/ytdlp-cli/bin/srtstripper" | shasum -a 256 -c -
          /usr/local/ytdlp-cli/run-ytdlp.sh --check > dist/installed-check.txt
          grep -q "ffmpeg dir" dist/installed-check.txt
          grep -q "yt-dlp" dist/installed-check.txt
          sudo /usr/local/ytdlp-cli/uninstall-macos.sh
          if [ -L /usr/local/bin/ytdlp ] || [ -e /usr/local/bin/ytdlp ]; then
            echo "PATH symlink survived the uninstall" >&2
            exit 1
          fi
          test ! -e /usr/local/ytdlp-cli
          if pkgutil --pkg-info com.github.chezhenkie.ytdlp-cli >/dev/null 2>&1; then
            echo "pkg receipt survived the uninstall" >&2
            exit 1
          fi
          echo "pkg proof passed: install, selftest 190/0, pins, writability, launcher, uninstall"
      - name: checksums and sizes
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 *.pkg > SHA256SUMS
          cat SHA256SUMS
          ls -l ytdlp-cli-*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: |
            dist/ytdlp-cli-*.pkg
            dist/SHA256SUMS
          if-no-files-found: error
