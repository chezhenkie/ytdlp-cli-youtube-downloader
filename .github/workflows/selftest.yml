name: selftest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: selftest ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: selftest
        run: python app-python/src/ytdlp.py --selftest
      - name: resolved paths and versions
        run: python app-python/src/ytdlp.py --check