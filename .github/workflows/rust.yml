name: rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: rust-src
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy, warnings denied
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: unit tests
        run: |
          cargo build --workspace
          cargo test --workspace
      - name: cross-check linux-musl (ubuntu only; ring builds C, so no pure cross)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add --toolchain 1.98.0 x86_64-unknown-linux-musl
          cargo check --workspace --target x86_64-unknown-linux-musl
      - name: east-asian width table matches the pinned reference (ubuntu only)
        if: runner.os == 'Linux'
        run: python tools/gen_width_table.py --check
      - name: printable table matches the pinned reference (ubuntu only)
        if: runner.os == 'Linux'
        run: python tools/gen_printable_table.py --check

  windows-build:
    name: windows release and PE import assertions
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust-src
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: release build, crt-static from repo .cargo/config.toml
        run: cargo build --release --workspace
      - name: sizes
        shell: pwsh
        run: |
          Get-Item target/release/ytdlp.exe |
            ForEach-Object { "size: $($_.Name) $($_.Length)" }
      - name: PE version resource assertions (FR-16)
        shell: pwsh
        run: |
          $m = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"')
          if (-not $m.Success) { throw "version not found in Cargo.toml" }
          $ver = $m.Groups[1].Value
          $v = (Get-Item target/release/ytdlp.exe).VersionInfo
          if ($v.ProductVersion -notlike "$ver*") { throw "ProductVersion: $($v.ProductVersion)" }
          if ($v.FileVersion -notlike "$ver*") { throw "FileVersion: $($v.FileVersion)" }
          if ($v.ProductName -ne "yt-dlp cli") { throw "ProductName: $($v.ProductName)" }
          if ($v.CompanyName -ne "chezhenkie") { throw "CompanyName: $($v.CompanyName)" }
          if ($v.FileDescription -ne "ytdlp") { throw "FileDescription: $($v.FileDescription)" }
          if (-not $v.LegalCopyright) { throw "LegalCopyright empty" }
          $v | Format-List ProductName, ProductVersion, FileVersion, CompanyName, LegalCopyright, FileDescription, Comments
      - name: PE import table must be free of vcruntime/msvcp (green assertion)
        run: python tools/pe_imports.py target/release/ytdlp.exe --forbid "vcruntime*.dll" --forbid "msvcp*.dll" --require "kernel32.dll"
      - name: deliberately dynamic CRT must show vcruntime (red self-test proves the checker sees it)
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C target-feature=-crt-static"
          cargo build --release -p ytdlp-cli --target-dir target/nocrt
          $dump = python tools/pe_imports.py target/nocrt/release/ytdlp.exe
          $dump
          if (-not ($dump -match "vcruntime")) { throw "red self-test failed: no vcruntime import in the dynamic-CRT build" }
      - uses: actions/upload-artifact@v4
        with:
          name: ytdlp-windows-x86_64-msvc
          path: rust-src/target/release/ytdlp.exe
          if-no-files-found: error

  linux-build:
    name: linux release builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust-src
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: x86_64-unknown-linux-musl
      - name: musl C toolchain (ring compiles C for the target)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: release build, gnu
        run: cargo build --release -p ytdlp-cli
      - name: release build, musl
        run: cargo build --release -p ytdlp-cli --target x86_64-unknown-linux-musl
      - name: sizes and formats
        run: |
          ls -l target/release/ytdlp target/x86_64-unknown-linux-musl/release/ytdlp
          file target/release/ytdlp target/x86_64-unknown-linux-musl/release/ytdlp
      - uses: actions/upload-artifact@v4
        with:
          name: ytdlp-linux-x86_64-gnu
          path: rust-src/target/release/ytdlp
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ytdlp-linux-x86_64-musl
          path: rust-src/target/x86_64-unknown-linux-musl/release/ytdlp
          if-no-files-found: error
