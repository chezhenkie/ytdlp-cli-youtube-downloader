name: rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: app-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy, warnings denied
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: unit tests
        run: cargo test --workspace
      - name: cross-check windows-msvc and linux-musl (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          rustup target add --toolchain 1.98.0 x86_64-pc-windows-msvc x86_64-unknown-linux-musl
          cargo check --workspace --target x86_64-pc-windows-msvc
          cargo check --workspace --target x86_64-unknown-linux-musl

  differential:
    name: differential ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: instrument self-test, python oracle only (NFR-4)
        run: python app-rust/tools/harness.py selftest
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: build the dispatcher
        working-directory: app-rust
        run: cargo build --release -p ytdlp-harness
      - name: dispatcher error-path probe
        run: python app-rust/tools/harness.py probe-rust --rust-bin app-rust/target/release/ytdlp-harness
      - name: differential over every vector (gate 2)
        run: python app-rust/tools/harness.py run-all --rust-bin app-rust/target/release/ytdlp-harness
      - name: east-asian width table matches the pinned oracle
        run: python app-rust/tools/gen_width_table.py --check

  windows-build:
    name: windows release and PE import assertions
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: release build, crt-static from repo .cargo/config.toml
        run: cargo build --release --workspace
      - name: sizes
        shell: pwsh
        run: |
          Get-Item target/release/ytdlp.exe, target/release/ytdlp-harness.exe |
            ForEach-Object { "size: $($_.Name) $($_.Length)" }
      - name: PE import table must be free of vcruntime/msvcp (green assertion)
        run: python tools/pe_imports.py target/release/ytdlp.exe --forbid "vcruntime*.dll" --forbid "msvcp*.dll" --require "kernel32.dll"
      - name: deliberately dynamic CRT must show vcruntime (red self-test proves the checker sees it)
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C target-feature=-crt-static"
          cargo build --release -p ytdlp-cli --target-dir target/nocrt
          $dump = python tools/pe_imports.py target/nocrt/release/ytdlp.exe
          $dump
          if (-not ($dump -match "vcruntime")) { throw "red self-test failed: no vcruntime import in the dynamic-CRT build" }
      - uses: actions/upload-artifact@v4
        with:
          name: ytdlp-windows-x86_64-msvc
          path: app-rust/target/release/ytdlp.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ytdlp-harness-windows-x86_64-msvc
          path: app-rust/target/release/ytdlp-harness.exe
          if-no-files-found: error

  linux-build:
    name: linux release builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: x86_64-unknown-linux-musl
      - name: release build, gnu
        run: cargo build --release -p ytdlp-cli
      - name: release build, musl
        run: cargo build --release -p ytdlp-cli --target x86_64-unknown-linux-musl
      - name: sizes and formats
        run: |
          ls -l target/release/ytdlp target/x86_64-unknown-linux-musl/release/ytdlp
          file target/release/ytdlp target/x86_64-unknown-linux-musl/release/ytdlp
      - uses: actions/upload-artifact@v4
        with:
          name: ytdlp-linux-x86_64-gnu
          path: app-rust/target/release/ytdlp
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ytdlp-linux-x86_64-musl
          path: app-rust/target/x86_64-unknown-linux-musl/release/ytdlp
          if-no-files-found: error
