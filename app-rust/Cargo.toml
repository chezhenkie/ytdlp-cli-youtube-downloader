# Native port workspace (RUST-PORT-PLAN.md). Three members: the product
# binary (cli/), the differential harness dispatcher (harness/) and the
# scripted yt-dlp stand-in (fake-ytdlp/), the latter two development
# tools that are never shipped in a bundle.

[workspace]
resolver = "3"
members = ["cli", "harness", "fake-ytdlp"]

[workspace.package]
version = "2.0.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/chezhenkie/ytdlp-cli-youtube-downloader"

# Python ints are arbitrary precision, Rust ints are not; a ported line
# that relied on that silently wraps in release builds unless overflow
# checks stay on (python-to-rust-refactor-pitfalls.md item 4).
[profile.release]
overflow-checks = true
