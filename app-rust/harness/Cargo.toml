[package]
name = "ytdlp-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Differential harness dispatcher for the ytdlp native port (development tool, never shipped)."
publish = false

[[bin]]
name = "ytdlp-harness"
path = "src/main.rs"

[dependencies]
ytdlp-cli = { path = "../cli" }

# The phase-8 arms build their own archive fixtures from a member list, so
# the same case file drives both sides without a binary blob in the vector.
# The xz encoder is only used for that; the shipping cli decodes.
zip = { version = "7.2.0", default-features = false, features = [
    "deflate-flate2",
] }
tar = { version = "0.4.46", default-features = false }
lzma-rust2 = { version = "0.15.8", default-features = false, features = [
    "std",
    "xz",
    "encoder",
] }
