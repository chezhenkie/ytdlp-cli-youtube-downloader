[package]
name = "ytdlp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "yt-dlp cli - text-menu download wrapper around yt-dlp (native port)."

[lib]
name = "ytdlp_cli"
path = "src/lib.rs"

[[bin]]
name = "ytdlp"
path = "src/main.rs"

# The capability table in the specsheet (section 4): std has no
# registry, no access(2) and no console APIs, so these two FFI crates
# are the drawn entries from the minimal vetted crate set. Phase 6 adds
# the console features: VT enable, screen buffer info, the folder
# dialog and CoTaskMemFree.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
